baseURL = "https://fbetancourt.work/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "betancourt"
enableRobotsTXT = true
timeZone = "America/Mexico_City"

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[languages]
  [languages.en]
    locale = "en"
    label = "English"
    contentDir = "content_en"
    weight = 1
    
    [languages.en.params]
      description = "Readings, zettelkasten, and essays of Francisco Betancourt."
      subtitle = "here I write things"
      social_image = "og-image.png"

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        pageRef = "/"
        weight = 1
      [[languages.en.menu.main]]
        name = "About"
        pageRef = "/about"
        weight = 2
      [[languages.en.menu.main]]
        name = "Code"
        pageRef = "/proyectos-profesionales"
        weight = 3
      [[languages.en.menu.main]]
        name = "Academic"
        pageRef = "/proyectos-academicos"
        weight = 4
      [[languages.en.menu.main]]
        name = "CV"
        pageRef = "/cv"
        weight = 8

  [languages.es]
    locale = "es-mx"
    label = "Español"
    contentDir = "content_es"
    weight = 2
    
    [languages.es.params]
      description = "Lecturas, zettelkasten y textos de Francisco Betancourt."
      subtitle = "aquí escribo cosas"
      social_image = "og-image.png"

    [languages.es.menu]
      [[languages.es.menu.main]]
        name = "Inicio"
        pageRef = "/"
        weight = 1
      [[languages.es.menu.main]]
        name = "Sobre mí"
        pageRef = "/about"
        weight = 2
      [[languages.es.menu.main]]
        name = "Código"
        pageRef = "/proyectos-profesionales"
        weight = 3
      [[languages.es.menu.main]]
        name = "Académico"
        pageRef = "/proyectos-academicos"
        weight = 4
      [[languages.es.menu.main]]
        name = "Escritos"
        pageRef = "/posts"
        weight = 5
      [[languages.es.menu.main]]
        name = "Zettelkasten"
        pageRef = "/zettelkasten"
        weight = 6
      [[languages.es.menu.main]]
        name = "Lecturas"
        pageRef = "/lit"
        weight = 7
      [[languages.es.menu.main]]
        name = "CV"
        pageRef = "/cv"
        weight = 8
