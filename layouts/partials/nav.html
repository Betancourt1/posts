{{ $isAuthor := partial "author_enabled.html" . }}
<nav class="nav{{ if $isAuthor }} nav--author{{ end }}">
  {{ if $isAuthor }}
    <div class="nav-author-row">
      <span class="nav-title">{{ if eq .Site.Language.Lang "en" }}Notebooks{{ else }}Notebooks{{ end }}</span>
      <button
        type="button"
        class="author-action-button"
        data-author-action="add-notebook"
        aria-label="{{ if eq .Site.Language.Lang "en" }}New notebook{{ else }}Nuevo notebook{{ end }}"
        title="{{ if eq .Site.Language.Lang "en" }}New notebook{{ else }}Nuevo notebook{{ end }}"
      >
        {{ partial "author_icon.html" "folder-plus" }}
      </button>
    </div>
  {{ end }}
  <ul class="nav-list">
    {{ range .Site.Menus.main }}
    <li>
      {{ $href := partial "admin_href.html" (dict "page" $ "href" .URL) }}
      <a href="{{ $href }}" {{ if $.IsMenuCurrent "main" . }} class="active" {{ end }}>
        {{ .Name }}
      </a>
    </li>
    {{ end }}
  </ul>
</nav>
