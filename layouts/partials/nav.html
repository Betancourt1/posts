<nav class="nav">
  <ul class="nav-list">
    {{ range .Site.Menus.main }}
    <li>
      <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }} class="active" {{ end }}>
        {{ .Name }}
      </a>
    </li>
    {{ end }}
  </ul>
  {{ if and hugo.IsServer (eq hugo.Environment "author") }}
    <div class="nav-author-actions">
      <button
        type="button"
        class="author-action-button"
        data-author-action="add-notebook"
        aria-label="{{ if eq .Site.Language.Lang "en" }}New notebook{{ else }}Nuevo notebook{{ end }}"
        title="{{ if eq .Site.Language.Lang "en" }}New notebook{{ else }}Nuevo notebook{{ end }}"
      >
        {{ partial "author_icon.html" "folder-plus" }}
      </button>
    </div>
  {{ end }}
</nav>
