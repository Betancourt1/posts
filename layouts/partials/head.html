<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{{ $buildID := printf "%d" now.UnixNano }}
<meta name="x-build-id" content="{{ $buildID }}" />
<script>
  (function () {
    var storageKey = "site_theme";
    var theme = "dark";

    try {
      var savedTheme = window.localStorage ? localStorage.getItem(storageKey) : null;
      if (savedTheme === "light" || savedTheme === "dark") {
        theme = savedTheme;
      }
    } catch (error) {
      theme = "dark";
    }

    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<title>
  {{ if .IsHome }}
    {{ .Site.Title }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>
{{ with .Site.Params.description }}
  <meta name="description" content="{{ . }}" />
{{ end }}
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v={{ $buildID }}" />
{{ $showSearch := partial "search_enabled.html" . }}
{{ if $showSearch }}
  <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}?v={{ $buildID }}" />
  <script src="{{ "pagefind/pagefind-ui.js" | relURL }}?v={{ $buildID }}" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      var searchElement = document.getElementById("search");
      if (!searchElement || typeof window.PagefindUI === "undefined") {
        return;
      }

      var bundlePath = "{{ "pagefind/" | relURL }}";
      var indexProbePath = "{{ "pagefind/pagefind.js" | relURL }}";

      fetch(indexProbePath)
        .then(function (response) {
          if (!response.ok) {
            return;
          }

          searchElement.classList.remove("site-search--hidden");

          new window.PagefindUI({
            element: "#search",
            bundlePath: bundlePath,
            resetStyles: false,
            showImages: false,
            showSubResults: true,
            placeholder: "Buscar en el sitio",
            translations: {
              load_more: "Ver más resultados",
              search_label: "Buscar",
              filters_label: "Filtros",
              zero_results: "No hay resultados para [SEARCH_TERM]",
              one_result: "[COUNT] resultado para [SEARCH_TERM]",
              many_results: "[COUNT] resultados para [SEARCH_TERM]",
              searching: "Buscando [SEARCH_TERM]..."
            }
          });
        })
        .catch(function () {
          return;
        });
    });
  </script>
{{ end }}
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    var buildMeta = document.querySelector("meta[name='x-build-id']");
    if (!buildMeta || !buildMeta.content) {
      return;
    }

    var currentBuild = buildMeta.content;
    var sessionKey = "site_build_seen";
    if (window.sessionStorage && sessionStorage.getItem(sessionKey) === currentBuild) {
      return;
    }

    var probeUrl = window.location.pathname + "?__build_probe=" + Date.now();
    fetch(probeUrl, { cache: "no-store", credentials: "same-origin" })
      .then(function (response) {
        if (!response.ok) {
          return null;
        }
        return response.text();
      })
      .then(function (html) {
        if (!html) {
          return;
        }

        var match = html.match(/<meta\s+name=["']x-build-id["']\s+content=["']([^"']+)["']/i);
        if (!match || !match[1]) {
          return;
        }

        var latestBuild = match[1];
        if (window.sessionStorage) {
          sessionStorage.setItem(sessionKey, latestBuild);
        }
        if (latestBuild === currentBuild) {
          return;
        }

        var params = new URLSearchParams(window.location.search);
        params.set("__v", latestBuild);
        params.delete("__build_probe");
        var nextQuery = params.toString();
        var nextUrl = window.location.pathname + (nextQuery ? "?" + nextQuery : "") + window.location.hash;
        window.location.replace(nextUrl);
      })
      .catch(function () {
        return;
      });
  });
</script>
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    var toggle = document.getElementById("theme-toggle");
    if (!toggle) {
      return;
    }

    var root = document.documentElement;
    var storageKey = "site_theme";
    var resolveTheme = function () {
      var current = root.getAttribute("data-theme");
      if (current === "light" || current === "dark") {
        return current;
      }
      return "dark";
    };

    var applyTheme = function (theme) {
      root.setAttribute("data-theme", theme);
      if (theme === "light") {
        toggle.textContent = "Tema oscuro";
        toggle.setAttribute("aria-label", "Cambiar a tema oscuro");
        return;
      }
      toggle.textContent = "Tema claro";
      toggle.setAttribute("aria-label", "Cambiar a tema claro");
    };

    applyTheme(resolveTheme());

    toggle.addEventListener("click", function () {
      var nextTheme = resolveTheme() === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
      try {
        if (window.localStorage) {
          localStorage.setItem(storageKey, nextTheme);
        }
      } catch (error) {
        return;
      }
    });
  });
</script>
<link rel="apple-touch-icon" href="{{ "favicon-32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon-16.png" | relURL }}">
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
