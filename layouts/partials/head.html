<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{{ $buildID := printf "%d" now.UnixNano }}
<meta name="x-build-id" content="{{ $buildID }}" />
<title>
  {{ if .IsHome }}
    {{ .Site.Title }}
  {{ else }}
    {{ .Title }} | {{ .Site.Title }}
  {{ end }}
</title>
{{ with .Site.Params.description }}
  <meta name="description" content="{{ . }}" />
{{ end }}
<script>
  (function () {
    var storageKey = "site_theme";
    var theme = "dark";

    try {
      var storedTheme = window.localStorage ? localStorage.getItem(storageKey) : null;
      if (storedTheme === "light" || storedTheme === "dark") {
        theme = storedTheme;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
        theme = "light";
      }
    } catch (error) {
      theme = "dark";
    }

    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v={{ $buildID }}" />
{{ $showSearch := partial "search_enabled.html" . }}
{{ if $showSearch }}
  <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}?v={{ $buildID }}" />
  <script src="{{ "pagefind/pagefind-ui.js" | relURL }}?v={{ $buildID }}" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      var searchElement = document.getElementById("search");
      if (!searchElement || typeof window.PagefindUI === "undefined") {
        return;
      }

      var bundlePath = "{{ "pagefind/" | relURL }}";
      var indexProbePath = "{{ "pagefind/pagefind.js" | relURL }}";

      fetch(indexProbePath)
        .then(function (response) {
          if (!response.ok) {
            return;
          }

          searchElement.classList.remove("site-search--hidden");

          new window.PagefindUI({
            element: "#search",
            bundlePath: bundlePath,
            resetStyles: false,
            showImages: false,
            showSubResults: true,
            placeholder: "Buscar en el sitio",
            translations: {
              load_more: "Ver mas resultados",
              search_label: "Buscar",
              filters_label: "Filtros",
              zero_results: "No hay resultados para [SEARCH_TERM]",
              one_result: "[COUNT] resultado para [SEARCH_TERM]",
              many_results: "[COUNT] resultados para [SEARCH_TERM]",
              searching: "Buscando [SEARCH_TERM]..."
            }
          });
        })
        .catch(function () {
          return;
        });
    });
  </script>
{{ end }}
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    var buildMeta = document.querySelector("meta[name='x-build-id']");
    if (!buildMeta || !buildMeta.content) {
      return;
    }

    var currentBuild = buildMeta.content;
    var sessionKey = "site_build_seen";
    if (window.sessionStorage && sessionStorage.getItem(sessionKey) === currentBuild) {
      return;
    }

    var probeUrl = window.location.pathname + "?__build_probe=" + Date.now();
    fetch(probeUrl, { cache: "no-store", credentials: "same-origin" })
      .then(function (response) {
        if (!response.ok) {
          return null;
        }
        return response.text();
      })
      .then(function (html) {
        if (!html) {
          return;
        }

        var match = html.match(/<meta\s+name=["']x-build-id["']\s+content=["']([^"']+)["']/i);
        if (!match || !match[1]) {
          return;
        }

        var latestBuild = match[1];
        if (window.sessionStorage) {
          sessionStorage.setItem(sessionKey, latestBuild);
        }
        if (latestBuild === currentBuild) {
          return;
        }

        var params = new URLSearchParams(window.location.search);
        params.set("__v", latestBuild);
        params.delete("__build_probe");
        var nextQuery = params.toString();
        var nextUrl = window.location.pathname + (nextQuery ? "?" + nextQuery : "") + window.location.hash;
        window.location.replace(nextUrl);
      })
      .catch(function () {
        return;
      });
  });
</script>
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    var root = document.documentElement;
    var body = document.body;
    var themeToggle = document.getElementById("theme-toggle");
    var navToggle = document.getElementById("nav-toggle");
    var navOverlay = document.getElementById("nav-overlay");
    var storageKey = "site_theme";

    function normalizeTheme(theme) {
      return theme === "light" ? "light" : "dark";
    }

    function updateThemeControl(theme) {
      if (!themeToggle) {
        return;
      }

      var nextTheme = theme === "dark" ? "light" : "dark";
      themeToggle.setAttribute("data-next-theme", nextTheme);
      themeToggle.setAttribute(
        "aria-label",
        nextTheme === "light" ? "Cambiar a modo claro" : "Cambiar a modo oscuro"
      );
      themeToggle.textContent = nextTheme === "light" ? "Modo claro" : "Modo oscuro";
    }

    function setTheme(theme, persist) {
      var normalized = normalizeTheme(theme);
      root.setAttribute("data-theme", normalized);
      updateThemeControl(normalized);

      if (persist) {
        try {
          localStorage.setItem(storageKey, normalized);
        } catch (error) {
          return;
        }
      }
    }

    setTheme(root.getAttribute("data-theme"), false);

    if (themeToggle) {
      themeToggle.addEventListener("click", function () {
        var nextTheme = themeToggle.getAttribute("data-next-theme");
        setTheme(nextTheme, true);
      });
    }

    function setNavOpen(isOpen) {
      if (!body) {
        return;
      }
      body.classList.toggle("nav-open", isOpen);
      if (navToggle) {
        navToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      }
    }

    if (navToggle) {
      navToggle.addEventListener("click", function () {
        setNavOpen(!body.classList.contains("nav-open"));
      });
    }

    if (navOverlay) {
      navOverlay.addEventListener("click", function () {
        setNavOpen(false);
      });
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && body.classList.contains("nav-open")) {
        setNavOpen(false);
      }
    });

    window.addEventListener("resize", function () {
      if (window.innerWidth > 1000 && body.classList.contains("nav-open")) {
        setNavOpen(false);
      }
    });
  });
</script>
<link rel="apple-touch-icon" href="{{ "favicon-32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32.png" | relURL }}">
