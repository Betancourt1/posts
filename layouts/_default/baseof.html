<!doctype html>
<html lang="es">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="layout">
      <aside class="column nav-column">
        {{ partial "nav.html" . }}
      </aside>
      <main class="column content-column">
        {{ block "main" . }}{{ end }}
      </main>
      <aside class="column sidebar-column">
        {{ partial "sidebar.html" . }}
      </aside>
    </div>
    {{ partial "footer.html" . }}
  </body>
</html>
