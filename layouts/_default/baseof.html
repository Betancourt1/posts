<!doctype html>
<html lang="es">

<head>
  {{ partial "head.html" . }}
</head>

<body>
  {{ $showSearch := partial "search_enabled.html" . }}
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">
        <h1 class="site-title"><a href="{{ "/" | relURL }}">betancourt</a></h1>
        <p class="site-subtitle">aqui escribo cosas</p>
      </div>
      <div class="site-controls">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">Modo claro</button>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-controls="site-nav-column" aria-expanded="false">Menu</button>
      </div>
    </div>
    {{ if $showSearch }}
      <div class="site-search site-search--hidden" id="search"></div>
    {{ end }}
  </header>
  <div class="layout">
    <aside class="column nav-column" id="site-nav-column">
      {{ partial "nav.html" . }}
    </aside>
    <main class="column content-column">
      <div class="content-inner">
        {{ block "main" . }}{{ end }}
      </div>
    </main>
    <aside class="column sidebar-column">
      {{ partial "sidebar.html" . }}
    </aside>
  </div>
  <button class="nav-overlay" id="nav-overlay" type="button" tabindex="-1" aria-hidden="true"></button>
  {{ partial "footer.html" . }}
</body>

</html>
