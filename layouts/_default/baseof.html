<!doctype html>
<html lang="es">

<head>
  {{ partial "head.html" . }}
</head>

<body>
  {{ $showSearch := partial "search_enabled.html" . }}
  <header class="site-header">
    <h1 class="site-title"><a href="{{ "/" | relURL }}">betancourt</a></h1>
    <p class="site-subtitle">aquí escribo cosas</p>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">Tema claro</button>
    {{ if $showSearch }}
      <div class="site-search site-search--hidden" id="search"></div>
    {{ end }}
  </header>
  <div class="layout">
    <aside class="column nav-column">
      {{ partial "nav.html" . }}
    </aside>
    <main class="column content-column">
      <div class="content-inner">
        {{ block "main" . }}{{ end }}
      </div>
    </main>
    <aside class="column sidebar-column">
      {{ partial "sidebar.html" . }}
    </aside>
  </div>
  {{ partial "footer.html" . }}
</body>

</html>
